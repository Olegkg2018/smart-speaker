[project]
name = "happy-speaker"
version = "0.1.0"
description = "Домашняя умная колонка: сервер"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.116",
    "openai>=3.0",
    "faster-whisper>=1.1",
    # Ищет активационное слово локально: до него звук не уходит в облако.
    "vosk>=0.3.45",
    "piper-tts>=1.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "yt-dlp>=2024.10.7",
    "numpy>=1.26",
    # Рисует картинку для OLED колонки — так кириллица достаётся бесплатно.
    "pillow>=10.4",
    # Читает ID3-теги фонотеки для ночной разметки по жанру/настроению.
    "mutagen>=1.47",
]

[project.optional-dependencies]
opus = ["opuslib>=3.0.1"]
client = ["sounddevice>=0.5", "websockets>=13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
